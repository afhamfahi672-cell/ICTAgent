[project]
name = "ictagent"
version = "0.1.0"
description = "LLM-reasoning trading agent built on ICT / Smart Money Concepts"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",  # FastAPI's TestClient needs this
]
# Broker / LLM integrations are added as their modules are built out,
# not up front. Kept here for reference on what each leg will need:
#   kite     -> kiteconnect
#   oanda    -> requests (talks to the v20 REST API directly — the
#               oandapyV20 SDK is unmaintained and its sdist fails to
#               build against current setuptools, so we don't use it)
#   agent    -> anthropic
#   context  -> requests (Finnhub news/calendar); tzdata guarantees
#               zoneinfo has IANA data on platforms without a system tz
#               database (Windows, some minimal containers) — harmless
#               where the system already has one (most Linux/macOS)
data = [
    "kiteconnect>=4.2",
    "requests>=2.28",
]
agent = [
    "anthropic>=0.40",
]
context = [
    "requests>=2.28",
    "tzdata>=2023.3",
]
# web: the hosted dashboard (ictagent/web/). itsdangerous signs the
# session cookie; python-multipart is required by FastAPI/Starlette to
# parse the login and phase-change HTML form posts.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ictagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
