<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ICTAgent{% endblock %}</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --panel-border: #2a3348;
    --text: #e6e9f0;
    --text-dim: #9aa4ba;
    --accent: #5b8def;
    --green: #3ecf8e;
    --amber: #e0a536;
    --red: #e5484d;
    --gray: #4b5568;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 0.02em; }
  header a { color: var(--text-dim); text-decoration: none; font-size: 14px; }
  header a:hover { color: var(--text); }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  .panel h2 { margin-top: 0; font-size: 15px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge-paper { background: rgba(91,141,239,0.18); color: var(--accent); }
  .badge-semi_auto { background: rgba(224,165,54,0.18); color: var(--amber); }
  .badge-autonomous { background: rgba(229,72,77,0.18); color: var(--red); }
  .badge-enter { background: rgba(62,207,142,0.18); color: var(--green); }
  .badge-exit { background: rgba(91,141,239,0.18); color: var(--accent); }
  .badge-hold, .badge-no_trade { background: rgba(75,85,104,0.35); color: var(--text-dim); }
  form.inline { display: inline; }
  select, button, input[type="password"] {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--panel-border);
    background: #10151f;
    color: var(--text);
  }
  button {
    background: var(--accent);
    border: none;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button.secondary { background: #232c40; color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--panel-border); vertical-align: top; }
  th { color: var(--text-dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  .rationale { color: var(--text-dim); font-size: 13px; max-width: 420px; }
  .muted { color: var(--text-dim); font-size: 13px; }
  .error-box {
    background: rgba(229,72,77,0.12);
    border: 1px solid rgba(229,72,77,0.4);
    color: #f4a3a6;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 80vh; }
  .login-box { width: 320px; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
